[package]
name = "rcat"
version = "0.1.0"
edition = "2024"
authors = ["Adi Rahman Hakim <adrhmnhkm@gmail.com>"]
description = "A modern, blazingly fast cat alternative written in pure Rust with syntax highlighting, git integration, and hex viewer."
license = "MIT"
repository = "https://github.com/adrhmnhkm/rcat"
readme = "README.md"
keywords = ["cat", "cli", "syntax-highlighting", "git", "hex"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
